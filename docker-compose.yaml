# We intentionally do NOT use `extends` here, so the host port mapping can
# be overridden without fighting the list-merge behavior of docker-compose
# extends. The content below mirrors `.config/docker-compose-base.yaml`
# (managed by Grafana plugin tools) with a different host port so this dev
# Grafana can run alongside any other local Grafana on port 3000.
services:
  grafana:
    user: root
    container_name: 'alphainfo-secopsmonitor-panel'

    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.4.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - "${GRAFANA_HOST_PORT:-3100}:3000/tcp"
    volumes:
      - ./dist:/var/lib/grafana/plugins/alphainfo-secopsmonitor-panel
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/alphainfo-secopsmonitor-panel

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.alphainfo-secopsmonitor-panel:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: alphainfo-secopsmonitor-panel
